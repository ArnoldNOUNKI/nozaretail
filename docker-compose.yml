# Déploiement Coolify : « Docker Compose » → pointez sur ce fichier.
# Le domaine est à associer au service "app" (port 8080) dans Coolify.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"

  # Tâches planifiées : annulation des commandes Mobile Money impayées (toutes les 10 min)
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      AUTORUN_ENABLED: "false"
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    volumes:
      - storage:/var/www/html/storage/app
    depends_on: [app]

  # File d'attente (e-mails de commande)
  queue:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      AUTORUN_ENABLED: "false"
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    volumes:
      - storage:/var/www/html/storage/app
    depends_on: [app]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

volumes:
  storage:
  mysql:
